<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PRISMA14</title>

<style>

:root {
  --background: #111111;
  --text: #e8e6e1;
  --secondary: #858585;
  --line: #292929;
  --soft: #1a1a1a;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 28px 22px 110px;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 5px;
}

.system-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d8d6d0;
}

/* MARKET */

.market {
  margin-top: 65px;
}

.market-name {
  font-size: 14px;
  color: var(--secondary);
  letter-spacing: 2px;
}

.market-row {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin-top: 10px;
}

.price {
  font-size: 46px;
  font-weight: 300;
  letter-spacing: -2px;
}

.change {
  font-size: 14px;
  color: #a5a5a5;
  margin-bottom: 7px;
}

.timeframe {
  margin-top: 12px;
  font-size: 11px;
  color: var(--secondary);
  letter-spacing: 2px;
}

/* CHART */

.chart-section {
  margin-top: 40px;
  height: 240px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}

.chart {
  width: 100%;
  height: 100%;
}

.chart-line {
  fill: none;
  stroke: #e8e6e1;
  stroke-width: 2;
  opacity: .9;
}

.chart-area {
  fill: url(#gradient);
  opacity: .25;
}

/* SECTION */

.section {
  margin-top: 55px;
}

.section-title {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--secondary);
  margin-bottom: 20px;
}

/* ANALYSIS */

.status {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 17px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e8e6e1;
}

.analysis-list {
  margin-top: 22px;
  border-top: 1px solid var(--line);
}

.analysis-row {
  display: flex;
  justify-content: space-between;
  padding: 17px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.analysis-label {
  color: var(--secondary);
}

.analysis-value {
  color: var(--text);
}

/* CGA DOT */

.cga {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cga-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #d8d6d0;
}

/* TRADE */

.trade-empty {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 28px 0;
  font-size: 15px;
  color: var(--secondary);
}

/* NAVIGATION */

.nav {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  background: rgba(17,17,17,.96);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(20px);
}

.nav-inner {
  max-width: 600px;
  margin: auto;
  display: flex;
  justify-content: space-around;
  padding: 15px 8px 30px;
}

.nav-item {
  border: none;
  background: none;
  color: #666;
  font-family: inherit;
  font-size: 9px;
  letter-spacing: .5px;
  padding: 8px;
  transition: color .3s ease;
}

.nav-item.active {
  color: var(--text);
}

/* PAGE TRANSITION */

.page {
  animation: enter .45s cubic-bezier(.22,.61,.36,1);
}

@keyframes enter {

  from {
    opacity: 0;
    transform: translateY(12px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

</style>
</head>


<body>

<main class="app page">

  <header class="header">

    <div class="logo">
      PRISMA14
    </div>

    <div class="system-dot"></div>

  </header>


  <!-- MERCATO -->

  <section class="market">

    <div class="market-name">
      EUR / USD
    </div>

    <div class="market-row">

      <div class="price">
        1,08420
      </div>

      <div class="change">
        +0,32%
      </div>

    </div>

    <div class="timeframe">
      1 ORA
    </div>

  </section>


  <!-- GRAFICO -->

  <section class="chart-section">

    <svg
      class="chart"
      viewBox="0 0 400 240"
      preserveAspectRatio="none">

      <defs>

        <linearGradient
          id="gradient"
          x1="0"
          x2="0"
          y1="0"
          y2="1">

          <stop
            offset="0%"
            stop-color="#ffffff"
            stop-opacity=".5"/>

          <stop
            offset="100%"
            stop-color="#ffffff"
            stop-opacity="0"/>

        </linearGradient>

      </defs>

      <path
        class="chart-area"
        d="M0,180
        C30,160 45,175 70,130
        C100,80 125,120 150,95
        C175,70 190,130 220,105
        C250,75 270,90 300,55
        C330,20 360,80 400,40
        L400,240 L0,240 Z"/>

      <path
        class="chart-line"
        d="M0,180
        C30,160 45,175 70,130
        C100,80 125,120 150,95
        C175,70 190,130 220,105
        C250,75 270,90 300,55
        C330,20 360,80 400,40"/>

    </svg>

  </section>


  <!-- ANALISI -->

  <section class="section">

    <div class="section-title">
      ANALISI
    </div>

    <div class="status">

      <div class="status-dot"></div>

      IN OSSERVAZIONE

    </div>


    <div class="analysis-list">

      <div class="analysis-row">

        <div class="analysis-label">
          Qualità del segnale
        </div>

        <div class="analysis-value">
          87 / 100
        </div>

      </div>


      <div class="analysis-row">

        <div class="analysis-label">
          Tendenza
        </div>

        <div class="analysis-value">
          Rialzista
        </div>

      </div>


      <div class="analysis-row">

        <div class="analysis-label">
          Pattern
        </div>

        <div class="analysis-value">
          In attesa
        </div>

      </div>


      <div class="analysis-row">

        <div class="analysis-label">
          CGA
        </div>

        <div class="analysis-value cga">

          <div class="cga-dot"></div>

          Blu

        </div>

      </div>

    </div>

  </section>


  <!-- OPERAZIONE -->

  <section class="section">

    <div class="section-title">
      OPERAZIONE
    </div>

    <div class="trade-empty">

      Nessuna operazione attiva

    </div>

  </section>

</main>


<!-- NAV -->

<nav class="nav">

  <div class="nav-inner">

    <button class="nav-item active">
      HOME
    </button>

    <button class="nav-item">
      MERCATI
    </button>

    <button class="nav-item">
      OPERAZIONI
    </button>

    <button class="nav-item">
      CGA
    </button>

    <button class="nav-item">
      ALTRO
    </button>

  </div>

</nav>

</body>
</html>
