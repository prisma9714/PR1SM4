<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PR1SM4</title>

<style>

:root {
    --background: #111111;
    --surface: #1a1a1a;
    --surface-light: #202020;
    --text: #e8e6e1;
    --secondary: #858585;
    --line: #292929;
    --positive: #8fbf9b;
    --negative: #c98282;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        sans-serif;
}

.app {
    max-width: 520px;
    margin: auto;
    min-height: 100vh;
    padding: 24px 20px 120px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 45px;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
}

.profile {
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--secondary);
}

/* SALDO */

.overview {
    animation: appear 0.8s ease;
}

.label {
    color: var(--secondary);
    font-size: 14px;
    margin-bottom: 8px;
}

.balance {
    font-size: 46px;
    font-weight: 600;
    letter-spacing: -2px;
}

.performance {
    margin-top: 10px;
    color: var(--positive);
    font-size: 15px;
}

/* GRAFICO */

.chart {
    height: 260px;
    margin-top: 35px;
    position: relative;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
}

.chart svg {
    width: 100%;
    height: 100%;
}

.line {
    fill: none;
    stroke: var(--text);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.area {
    fill: url(#gradient);
}

/* PERIODI */

.periods {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    margin-bottom: 45px;
}

.period {
    border: none;
    background: none;
    color: var(--secondary);
    font-size: 13px;
    padding: 8px;
}

.period.active {
    color: var(--text);
}

/* STATISTICHE */

.section-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
}

.stat {
    background: var(--surface);
    padding: 20px;
}

.stat-label {
    color: var(--secondary);
    font-size: 13px;
}

.stat-value {
    margin-top: 10px;
    font-size: 21px;
}

/* TRANSAZIONI */

.transactions {
    margin-top: 50px;
}

.transaction {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
}

.transaction-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.transaction-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--surface-light);
    display: flex;
    align-items: center;
    justify-content: center;
}

.transaction-name {
    font-size: 16px;
}

.transaction-date {
    font-size: 13px;
    color: var(--secondary);
    margin-top: 4px;
}

.transaction-value {
    font-size: 16px;
    text-align: right;
}

.positive {
    color: var(--positive);
}

.negative {
    color: var(--negative);
}
/* NAVIGAZIONE */

.navigation {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    width: calc(100% - 32px);
    max-width: 480px;

    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-around;

    padding: 0 8px;

    background: rgba(26, 26, 26, 0.88);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid #303030;
    border-radius: 22px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.35);
}

.nav-item {
    flex: 1;

    height: 100%;

    background: transparent;
    border: none;

    color: var(--secondary);

    font-family: inherit;
    font-size: 11px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    transition:
        color 0.25s ease,
        transform 0.25s ease;
}

.nav-item span {
    font-size: 11px;
}

.nav-icon {
    font-size: 18px;
    line-height: 1;
}

.nav-item.active {
    color: var(--text);
}

.nav-item:active {
    transform: scale(0.92);
}

/* ANIMAZIONE */

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

</style>
</head>

<body>

    </main>

</div>





<script>

const periods =
document.querySelectorAll(".period");

periods.forEach(period => {

    period.addEventListener("click", () => {

        periods.forEach(item => {
            item.classList.remove("active");
        });

        period.classList.add("active");

    });

});

</script>

</body>
</html>
